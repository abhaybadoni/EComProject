<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#86198f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#f5d0fe" stroke-width="1.5" />
  <text x="55" y="68" fill="#f5d0fe" font-size="13" font-weight="900" letter-spacing="1">RIVAAZ ETHNO</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">FESTIVE ETHNIC WEAR</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#a21caf" opacity="0.3" />
            <!-- Kurta Silhouette -->
            <path d="M 330 280 L 400 320 L 470 280 L 520 330 L 480 520 L 320 520 L 280 330 Z" fill="#86198f" stroke="#f5d0fe" stroke-width="4" />
            <!-- Placket Embroidery -->
            <line x1="400" y1="320" x2="400" y2="440" stroke="#fef08a" stroke-width="6" stroke-dasharray="8,4" />
            <circle cx="400" cy="360" r="6" fill="#fbbf24" />
            <circle cx="400" cy="390" r="6" fill="#fbbf24" />
            <circle cx="400" cy="420" r="6" fill="#fbbf24" />
            <text x="400" y="565" text-anchor="middle" fill="#f5d0fe" font-size="18" font-weight="bold">HAND EMBROIDERED SILK</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#f5d0fe" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Chanderi Silk Embroidered Kurta Set</text>
  <text x="60" y="742" fill="#f5d0fe" font-size="14" font-weight="600">Gotta-Patti Work with Chiffon Dupatta</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">✨</text>
</svg>
