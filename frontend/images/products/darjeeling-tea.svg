<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="55" y="68" fill="#a7f3d0" font-size="13" font-weight="900" letter-spacing="1">MAKAIBARI HERITAGE</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">100% ORGANIC DARJEELING TEA</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#065f46" opacity="0.4" />
            <rect x="290" y="310" width="220" height="230" rx="14" fill="#022c22" stroke="#34d399" stroke-width="5" />
            <rect x="270" y="285" width="260" height="30" rx="8" fill="#065f46" stroke="#6ee7b7" stroke-width="3" />
            <circle cx="400" cy="400" r="50" fill="#047857" stroke="#a7f3d0" stroke-width="2" />
            <text x="400" y="420" text-anchor="middle" font-size="44">🍃</text>
            <text x="400" y="480" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="bold">FIRST FLUSH 2026</text>
            <text x="400" y="505" text-anchor="middle" fill="#a7f3d0" font-size="12">CHAMPAGNE OF TEAS</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Estate Darjeeling First Flush Tea</text>
  <text x="60" y="742" fill="#a7f3d0" font-size="14" font-weight="600">Loose Leaf Spring Harvest (500g Golden Tin)</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🍵</text>
</svg>
