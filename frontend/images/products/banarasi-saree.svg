<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#fde047" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#fde047" stroke-width="1.5" />
  <text x="55" y="68" fill="#fde047" font-size="13" font-weight="900" letter-spacing="1">VARANASI BUNKAR</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">SILK MARK CERTIFIED • HANDLOOM</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#047857" opacity="0.4" />
            <!-- Saree Drape & Gold Zari Pattern -->
            <path d="M 270 300 L 530 300 L 500 520 L 250 500 Z" fill="#065f46" stroke="#fbbf24" stroke-width="4" />
            <!-- Gold Zari Brocade Lines -->
            <line x1="270" y1="350" x2="520" y2="350" stroke="#fbbf24" stroke-width="6" stroke-dasharray="10,5" />
            <line x1="265" y1="410" x2="510" y2="410" stroke="#fef08a" stroke-width="8" stroke-dasharray="12,6" />
            <line x1="260" y1="465" x2="505" y2="465" stroke="#fbbf24" stroke-width="12" stroke-dasharray="15,4" />
            <circle cx="400" cy="380" r="40" fill="#022c22" stroke="#fde047" stroke-width="3" />
            <text x="400" y="398" text-anchor="middle" font-size="40">🥻</text>
            <text x="400" y="560" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="bold">HERITAGE VARANASI WEAVE</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#fde047" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Pure Katan Silk Banarasi Saree</text>
  <text x="60" y="742" fill="#fde047" font-size="14" font-weight="600">Emerald Green with Real Gold Zari Pallu</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🥻</text>
</svg>
