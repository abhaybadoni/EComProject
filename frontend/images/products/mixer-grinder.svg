<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#ea580c" stroke-width="1.5" />
  <text x="55" y="68" fill="#ea580c" font-size="13" font-weight="900" letter-spacing="1">PREETHI</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">5-YEAR MOTOR WARRANTY • BIS APPROVED</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#334155" opacity="0.4" />
            <!-- Mixer Base Unit -->
            <path d="M 310 400 L 490 400 L 510 520 L 290 520 Z" fill="#ea580c" stroke="#f8fafc" stroke-width="4" />
            <!-- Speed Control Knob -->
            <circle cx="400" cy="460" r="24" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
            <line x1="400" y1="460" x2="415" y2="448" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
            <!-- Top Jar -->
            <path d="M 340 280 L 460 280 L 440 395 L 360 395 Z" fill="#cbd5e1" stroke="#f8fafc" stroke-width="4" />
            <rect x="330" y="260" width="140" height="22" rx="6" fill="#475569" />
            <!-- Jar Handle -->
            <path d="M 460 300 Q 500 330 450 370" stroke="#334155" stroke-width="10" fill="none" stroke-linecap="round" />
            <text x="400" y="565" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="bold">750W HEAVY DUTY MOTOR</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#ea580c" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Zodiac Cosmo 750W Mixer Grinder</text>
  <text x="60" y="742" fill="#ea580c" font-size="14" font-weight="600">Vega W5 Motor with 5 Stainless Steel Jars</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">⚡</text>
</svg>
