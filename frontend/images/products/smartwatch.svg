<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#60a5fa" stroke-width="1.5" />
  <text x="55" y="68" fill="#60a5fa" font-size="13" font-weight="900" letter-spacing="1">NOISE</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">BLUETOOTH CALLING • 7-DAY BATTERY</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#1e40af" opacity="0.3" />
            <!-- Watch Straps -->
            <rect x="360" y="240" width="80" height="100" rx="8" fill="#334155" />
            <rect x="360" y="470" width="80" height="100" rx="8" fill="#334155" />
            <!-- Watch Dial -->
            <rect x="330" y="320" width="140" height="170" rx="24" fill="#0f172a" stroke="#60a5fa" stroke-width="5" />
            <!-- Screen Content -->
            <text x="400" y="380" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">10:48</text>
            <text x="400" y="415" text-anchor="middle" fill="#ef4444" font-size="16">❤️ 72 BPM</text>
            <text x="400" y="445" text-anchor="middle" fill="#34d399" font-size="15">👣 8,420 Steps</text>
            <text x="400" y="590" text-anchor="middle" fill="#93c5fd" font-size="18" font-weight="bold">150+ CLOUD WATCH FACES</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#60a5fa" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">ColorFit Pulse Grand Calling Smartwatch</text>
  <text x="60" y="742" fill="#60a5fa" font-size="14" font-weight="600">1.69" HD Display with SpO2 & 24x7 Heart Rate</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">⌚</text>
</svg>
