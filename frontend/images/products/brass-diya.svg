<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#fde047" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#fde047" stroke-width="1.5" />
  <text x="55" y="68" fill="#fde047" font-size="13" font-weight="900" letter-spacing="1">TEMPLE ARTS BRASS</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">TRADITIONAL TEMPLE BRASS • HANDMADE</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#b45309" opacity="0.4" />
            <!-- Peacock Finial Top -->
            <circle cx="400" cy="300" r="22" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
            <text x="400" y="310" text-anchor="middle" font-size="24">🦚</text>
            <!-- Diya Oil Bowl & 5 Wick Notches -->
            <ellipse cx="400" cy="360" rx="90" ry="25" fill="#f59e0b" stroke="#fef08a" stroke-width="4" />
            <!-- Golden Flame -->
            <path d="M 400 315 Q 412 335 400 350 Q 388 335 400 315 Z" fill="#ef4444" />
            <circle cx="400" cy="340" r="6" fill="#fbbf24" />
            <!-- Column Stand -->
            <rect x="388" y="375" width="24" height="100" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="2" />
            <!-- Base Pedestal -->
            <ellipse cx="400" cy="485" rx="80" ry="22" fill="#b45309" stroke="#fef08a" stroke-width="4" />
            <text x="400" y="560" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="bold">AUSPICIOUS PUJA KUTHUVILAKKU</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#fde047" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Solid Brass Peacock Diya Kuthuvilakku</text>
  <text x="60" y="742" fill="#fde047" font-size="14" font-weight="600">Handcrafted Heavy Brass 5-Wick Pair (12 Inch)</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🪔</text>
</svg>
