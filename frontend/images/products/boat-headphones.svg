<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#ef4444" stroke-width="1.5" />
  <text x="55" y="68" fill="#ef4444" font-size="13" font-weight="900" letter-spacing="1">BOAT</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">1-YEAR WARRANTY • SIGNATURE SOUND</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#334155" opacity="0.3" />
            <!-- Headband Arch -->
            <path d="M 280 410 A 130 130 0 0 1 520 410" stroke="#0f172a" stroke-width="26" fill="none" stroke-linecap="round" />
            <path d="M 285 410 A 125 125 0 0 1 515 410" stroke="#ef4444" stroke-width="8" fill="none" />
            <!-- Left Earcup -->
            <rect x="250" y="380" width="55" height="100" rx="26" fill="#1e293b" stroke="#ef4444" stroke-width="4" />
            <circle cx="277" cy="430" r="14" fill="#ef4444" />
            <!-- Right Earcup -->
            <rect x="495" y="380" width="55" height="100" rx="26" fill="#1e293b" stroke="#ef4444" stroke-width="4" />
            <circle cx="522" cy="430" r="14" fill="#ef4444" />
            <text x="400" y="565" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">50 HOURS CONTINUOUS PLAYTIME</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#ef4444" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">boAt Rockerz 550 Over-Ear Wireless</text>
  <text x="60" y="742" fill="#ef4444" font-size="14" font-weight="600">50mm Drivers with boAt Super Extra Bass (50H Playtime)</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🎧</text>
</svg>
