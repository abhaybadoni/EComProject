<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="55" y="68" fill="#38bdf8" font-size="13" font-weight="900" letter-spacing="1">HAVELLS</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">2000W POWER • INDIAN PRESET MENUS</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#3f3f46" opacity="0.3" />
            <!-- Cooktop Body -->
            <rect x="270" y="300" width="260" height="230" rx="16" fill="#09090b" stroke="#52525b" stroke-width="4" />
            <!-- Crystal Induction Ring -->
            <circle cx="400" cy="390" r="75" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="16,6" />
            <circle cx="400" cy="390" r="50" fill="none" stroke="#fbbf24" stroke-width="3" />
            <circle cx="400" cy="390" r="20" fill="#dc2626" />
            <!-- Digital Display -->
            <rect x="350" y="480" width="100" height="30" rx="4" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" />
            <text x="400" y="501" text-anchor="middle" fill="#38bdf8" font-size="15" font-family="monospace" font-weight="bold">2000W</text>
            <text x="400" y="570" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">AUTO PAN DETECTION &amp; TIMER</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Smart Induction Cooktop 2000W</text>
  <text x="60" y="742" fill="#38bdf8" font-size="14" font-weight="600">Indian Auto-Cook Preset Menus (Roti, Dosa, Curry)</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🍳</text>
</svg>
