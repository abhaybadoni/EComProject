<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#fde047" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#fde047" stroke-width="1.5" />
  <text x="55" y="68" fill="#fde047" font-size="13" font-weight="900" letter-spacing="1">FOREST ESSENTIALS</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">CLASSICAL AYURVEDA • FSSAI CERTIFIED</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#92400e" opacity="0.3" />
            <!-- Amber Dropper Bottle -->
            <rect x="330" y="340" width="140" height="175" rx="20" fill="#78350f" stroke="#fbbf24" stroke-width="4" />
            <!-- Dropper Neck -->
            <rect x="375" y="295" width="50" height="45" fill="#b45309" stroke="#fbbf24" stroke-width="2" />
            <path d="M 370 295 L 430 295 L 415 260 L 385 260 Z" fill="#18181b" />
            <!-- Golden Herb Label -->
            <rect x="345" y="380" width="110" height="95" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
            <text x="400" y="415" text-anchor="middle" fill="#78350f" font-size="14" font-weight="bold">KUMKUMADI</text>
            <text x="400" y="435" text-anchor="middle" fill="#b45309" font-size="10">TAILAM (30ML)</text>
            <text x="400" y="460" text-anchor="middle" font-size="20">🌸</text>
            <text x="400" y="565" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="bold">PURE AYURVEDIC BEAUTY ELIXIR</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#fde047" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Kumkumadi Miraculous Night Fluid</text>
  <text x="60" y="742" fill="#fde047" font-size="14" font-weight="600">Kashmiri Saffron & 26 Ayurvedic Herbs (30ml)</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">✨</text>
</svg>
