<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#fed7aa" stroke-width="1.5" />
  <text x="55" y="68" fill="#fed7aa" font-size="13" font-weight="900" letter-spacing="1">KERALA SPICE CO.</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">STONE-GROUND AROMATIC SPICES</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#c2410c" opacity="0.3" />
            <!-- Brass Masala Dabba -->
            <circle cx="400" cy="420" r="140" fill="#b45309" stroke="#fbbf24" stroke-width="8" />
            <circle cx="400" cy="420" r="45" fill="#78350f" stroke="#fbbf24" stroke-width="2" />
            <!-- Compartments with Spices -->
            <circle cx="340" cy="370" r="30" fill="#18181b" /><!-- Pepper -->
            <circle cx="460" cy="370" r="30" fill="#15803d" /><!-- Cardamom -->
            <circle cx="340" cy="470" r="30" fill="#b91c1c" /><!-- Chilli -->
            <circle cx="460" cy="470" r="30" fill="#854d0e" /><!-- Cloves/Cinnamon -->
            <text x="400" y="432" text-anchor="middle" font-size="32">✨</text>
            <text x="400" y="585" text-anchor="middle" fill="#fef08a" font-size="18" font-weight="bold">ROYAL MALABAR SPICE BOX</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#fed7aa" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Malabar Whole Spices & Garam Masala</text>
  <text x="60" y="742" fill="#fed7aa" font-size="14" font-weight="600">Tellicherry Pepper, Cardamom & Cloves Gift Set</text>
  <text x="730" y="730" text-anchor="end" fill="#ffffff" font-size="32">🌶️</text>
</svg>
