<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" class="font-sans" />
  <circle cx="400" cy="400" r="380" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="760" rx="20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" />

  <!-- Brand & Badge Header -->
  <rect x="40" y="45" width="220" height="34" rx="6" fill="rgba(0,0,0,0.3)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="55" y="68" fill="#f59e0b" font-size="13" font-weight="900" letter-spacing="1">KASHMIR CROWN</text>

  <rect x="520" y="45" width="240" height="34" rx="6" fill="#ea580c" />
  <text x="640" y="67" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900">100% PURE KASHMIRI KESAR</text>

  <!-- Center Artwork -->
  
            <circle cx="400" cy="420" r="160" fill="#92400e" opacity="0.4" />
            <rect x="260" y="320" width="280" height="200" rx="16" fill="#b45309" stroke="#fbbf24" stroke-width="4" />
            <rect x="240" y="300" width="320" height="36" rx="8" fill="#d97706" stroke="#fef08a" stroke-width="2" />
            <circle cx="400" cy="420" r="60" fill="#78350f" stroke="#fbbf24" stroke-width="3" />
            <text x="400" y="445" text-anchor="middle" font-size="64">🌸</text>
            <path d="M 330 460 Q 400 500 470 460" stroke="#ef4444" stroke-width="6" fill="none" />
            <text x="400" y="560" text-anchor="middle" fill="#fef08a" font-size="20" font-weight="bold">ROYAL DRY FRUIT HAMPER</text>
        

  <!-- Bottom Title & Detail Plaque -->
  <rect x="40" y="680" width="720" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="60" y="715" fill="#ffffff" font-size="20" font-weight="900">Kashmiri Shahi Mogra Kesar</text>
  <text x="60" y="742" fill="#f59e0b" font-size="14" font-weight="600">Grade-A1 Pamposh Red Gold + Almonds Box</text>
